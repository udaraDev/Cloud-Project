# ============================================================
# KnucklesProducts — Kubernetes Secrets
# ============================================================
# IMPORTANT: In production, use Azure Key Vault with the
# Azure Key Vault Provider for Secrets Store CSI Driver
# instead of plain Kubernetes secrets.
#
# Replace <BASE64_ENCODED_VALUE> with actual base64-encoded values:
#   echo -n "your-value" | base64
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: knuckles-secrets
  namespace: knuckles
  labels:
    app: knuckles
type: Opaque
stringData:
  # Application key (generate with: php artisan key:generate --show)
  APP_KEY: "base64:7A1b2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0u="

  # MySQL credentials (matches mysql-deployment.yaml)
  DB_HOST: "mysql"
  DB_USERNAME: "knuckles"
  DB_PASSWORD: "secretpassword"

  # Redis credentials (matches redis-deployment.yaml)
  REDIS_HOST: "redis"
  REDIS_PASSWORD: ""

  # Mail credentials (using mailpit for demo)
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

  # Google OAuth (dummy)
  GOOGLE_CLIENT_ID: "dummy-client-id"
  GOOGLE_CLIENT_SECRET: "dummy-client-secret"
