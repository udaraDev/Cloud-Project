# ============================================================
# KnucklesProducts — Kubernetes Secrets
# ============================================================
# IMPORTANT: In production, use Azure Key Vault with the
# Azure Key Vault Provider for Secrets Store CSI Driver
# instead of plain Kubernetes secrets.
#
# Replace <BASE64_ENCODED_VALUE> with actual base64-encoded values:
#   echo -n "your-value" | base64
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: knuckles-secrets
  namespace: knuckles
  labels:
    app: knuckles
type: Opaque
data:
  # Application key (generate with: php artisan key:generate --show)
  APP_KEY: <BASE64_ENCODED_VALUE>

  # Azure Database for MySQL credentials
  DB_HOST: <BASE64_ENCODED_VALUE>
  DB_USERNAME: <BASE64_ENCODED_VALUE>
  DB_PASSWORD: <BASE64_ENCODED_VALUE>

  # Azure Cache for Redis credentials
  REDIS_HOST: <BASE64_ENCODED_VALUE>
  REDIS_PASSWORD: <BASE64_ENCODED_VALUE>

  # Mail credentials
  MAIL_HOST: <BASE64_ENCODED_VALUE>
  MAIL_PORT: <BASE64_ENCODED_VALUE>
  MAIL_USERNAME: <BASE64_ENCODED_VALUE>
  MAIL_PASSWORD: <BASE64_ENCODED_VALUE>

  # Google OAuth
  GOOGLE_CLIENT_ID: <BASE64_ENCODED_VALUE>
  GOOGLE_CLIENT_SECRET: <BASE64_ENCODED_VALUE>
